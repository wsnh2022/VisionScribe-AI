; Rename Config.ini As File Name After Api Key Added

[API]
Key  = your-openrouter-api-key-here
Url  = https://openrouter.ai/api/v1/chat/completions

[Paths]
TesseractExe = C:\Program Files\Tesseract-OCR\tesseract.exe

[Models]
; Add or remove models here. AHK reads them in order 1..Count.
; Label = display name shown in dropdown. Id = exact OpenRouter model string.
; First entry = default selected on launch.
Count = 3

1_Label = Gemini 2.0 Flash Lite (~$0.00014/img) [Cheapest]
1_Id    = google/gemini-2.0-flash-lite-001

2_Label = Llama 3.2 11B Vision  (~$0.00018/img) [Backup]
2_Id    = meta-llama/llama-3.2-11b-vision-instruct

3_Label = Gemini 2.0 Flash       (~$0.00019/img) [Accurate]
3_Id    = google/gemini-2.0-flash-001

[Prompts]
; Title = shown in dropdown (include tag in brackets at end e.g. [OCR] or [Vision])
; Text  = prompt content loaded into the Edit box on selection
; Add new prompts by incrementing Count and adding N_Title / N_Text keys
; Multiline not supported in .ini - keep each prompt on one line
Count = 11

1_Title = Organize to Markdown [OCR]
1_Text  = Here is OCR-extracted text from one or more files. Organize and convert into clean Markdown using proper headings, ordered sections, and full sentences. Fix broken lines. Preserve original wording without adding or summarizing. Output only the final Markdown.

2_Title = Extract Text Verbatim [Vision]
2_Text  = Extract all text visible in this image exactly as written. Do not reformat, summarize, or correct anything. Preserve original spelling, punctuation, and layout as closely as possible. Output only the extracted text.

3_Title = Extract Table to Markdown [OCR/Vision]
3_Text  = Extract all tables from this content and convert each into a proper Markdown table using | column | separators |. Preserve all column headers and cell values exactly. Output only the Markdown tables.

4_Title = Extract Key-Value Pairs [OCR/Vision]
4_Text  = Extract all key-value pairs, fields, and labels from this content. Format each as Key: Value on its own line. Preserve original labels and values exactly. Output only the list.

5_Title = Extract Handwritten Text [Vision]
5_Text  = This image contains handwritten text. Transcribe everything written as accurately as possible. If a word is unclear, make your best attempt and mark it with [?]. Output only the transcribed text.

6_Title = Summarize Content [OCR/Vision]
6_Text  = Summarize the key points from this content as a concise bullet list. Preserve all important facts, numbers, names, and dates. Do not add opinions or external information. Output only the bullet list.

7_Title = Proofread and Clean [OCR]
7_Text  = This text was extracted via OCR and may contain errors. Fix broken words, incorrect line breaks, garbled characters, and obvious spelling mistakes caused by OCR misreads. Do not change the meaning or rewrite sentences. Output only the corrected text.

8_Title = Translate to English [OCR/Vision]
8_Text  = Translate all text in this content to English. Preserve the original structure, headings, and formatting as much as possible. Output only the translated content.

9_Title = Extract Invoice or Receipt [Vision]
9_Text  = Extract all structured data from this invoice or receipt. Include: vendor name, date, line items with quantities and prices, subtotal, taxes, and total. Format as a clean structured list. Output only the extracted data.

10_Title = Convert to JSON [OCR/Vision]
10_Text  = Extract all structured data from this content and output it as a valid JSON object. Use logical key names based on the content. Do not include explanation or markdown code fences. Output only the raw JSON.

11_Title = Extract Instagram Post Content [Vision]
11_Text  = Describe the full content of this Instagram post. Extract all visible text exactly as written, identify the subject or topic, and note any key visual elements. Format as clean Markdown with a title, extracted text section, and brief description.

[Notion]
; Required for Push to Notion feature (v2.0-beta)
; Token: Integration token from https://www.notion.so/my-integrations
; DatabaseId: ID of the target database (share the database with your integration first)
Token      = secret_xxxxx
DatabaseId = xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

[Hotkeys]
; InstaSnap hotkey - triggers fetch from selected text in any window (v2.0-rc)
; AHK modifier symbols: ^ = Ctrl, + = Shift, ! = Alt, # = Win
InstaSnap = ^+i
